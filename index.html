<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devinons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Accueil de devinons.fr : choisir entre la télé et le téléphone.
   Gros boutons, navigables à la télécommande (flèches + OK). */
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  background: #F7F1E3; color: #1D2B4F; font: 18px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
  padding: 24px 16px;
}
main { width: min(100%, 760px); display: grid; gap: 22px; text-align: center; }
h1 { font: 800 clamp(44px, 9vw, 84px)/1 "Gluten", system-ui, sans-serif; margin: 0; }
h1 span { background: #FFE800; padding: 0 .2em; border-radius: 10px; box-shadow: 4px 5px 0 rgba(255,72,176,.55); }
p.sous { margin: 0; font-size: clamp(18px, 2.4vw, 24px); }
.boutons { display: grid; gap: 16px; }
a.bouton {
  display: grid; gap: 4px; text-decoration: none; color: #1D2B4F; background: #fff;
  border: 3px solid #1D2B4F; border-radius: 20px; padding: 20px 22px;
  box-shadow: 4px 5px 0 rgba(255,72,176,.55);
  font: 800 clamp(24px, 3.4vw, 36px)/1.15 "Gluten", system-ui, sans-serif;
}
a.bouton small { font: 400 clamp(16px, 2vw, 20px)/1.3 "Atkinson Hyperlegible", system-ui, sans-serif; }
a.bouton.tele { background: #FFE800; }
a.bouton:focus-visible, a.bouton:hover { outline: 5px solid #0078BF; outline-offset: 4px; }
footer { font-size: 16px; }
footer a { color: #1D2B4F; }
</style>
</head>
<body>
<main>
  <h1><span>Devinons</span></h1>
  <p class="sous">Le quiz en famille, dès 4 ans.</p>
  <div class="boutons">
    <a class="bouton tele" href="ecran.html" autofocus>📺 Afficher une partie sur la télé
      <small>On joue sur les téléphones, la télé montre les questions et les scores.</small></a>
    <a class="bouton" href="partie.html">📱 Rejoindre une partie
      <small>Sur un téléphone sans Devinons, iPhone compris : rien à installer.</small></a>
  </div>
  <footer><a href="confidentialite.html">Politique de confidentialité</a> · contactdevinons@gmail.com</footer>
</main>
<script>document.querySelector('a.tele').focus();</script>
</body>
</html>
